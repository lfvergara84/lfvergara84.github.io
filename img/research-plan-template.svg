<text x="80" y="111" font-size="14" font-weight="600" fill="#047857" text-anchor="start" font-family="Space Grotesk, IBM Plex Sans, Arial, sans-serif">Research plan · [Study name] · [Product area] · [Owner]</text>
<rect x="80" y="150" width="180" height="52" fill="#F4F4F0" stroke="#D9DBD3" stroke-width="1.2"/>
<text x="92" y="180" font-size="12" font-weight="600" fill="#171E27" text-anchor="start" font-family="Space Grotesk, IBM Plex Sans, Arial, sans-serif">Decision this informs</text>
<rect x="260" y="150" width="620" height="52" fill="#FFFFFF" stroke="#D9DBD3" stroke-width="1.2"/>
<text x="274" y="180" font-size="11.8" font-weight="400" fill="#171E27" text-anchor="start">Which of the two onboarding flows ships in Q3, and what must be true for each to win.</text>
<rect x="80" y="210" width="180" height="52" fill="#F4F4F0" stroke="#D9DBD3" stroke-width="1.2"/>
<text x="92" y="240" font-size="12" font-weight="600" fill="#171E27" text-anchor="start" font-family="Space Grotesk, IBM Plex Sans, Arial, sans-serif">Research questions</text>
<rect x="260" y="210" width="620" height="52" fill="#FFFFFF" stroke="#D9DBD3" stroke-width="1.2"/>
<text x="274" y="240" font-size="11.8" font-weight="400" fill="#171E27" text-anchor="start">1. Where do first-time users hesitate?  2. Which flow feels faster?  3. What would make them trust step 3?</text>
<rect x="80" y="270" width="180" height="52" fill="#F4F4F0" stroke="#D9DBD3" stroke-width="1.2"/>
<text x="92" y="300" font-size="12" font-weight="600" fill="#171E27" text-anchor="start" font-family="Space Grotesk, IBM Plex Sans, Arial, sans-serif">Method</text>
<rect x="260" y="270" width="620" height="52" fill="#FFFFFF" stroke="#D9DBD3" stroke-width="1.2"/>
<text x="274" y="300" font-size="11.8" font-weight="400" fill="#171E27" text-anchor="start">Unmoderated usability test, within-subject, counterbalanced order. 5-pt ratings + open-ends after each flow.</text>
<rect x="80" y="330" width="180" height="52" fill="#F4F4F0" stroke="#D9DBD3" stroke-width="1.2"/>
<text x="92" y="360" font-size="12" font-weight="600" fill="#171E27" text-anchor="start" font-family="Space Grotesk, IBM Plex Sans, Arial, sans-serif">Participants</text>
<rect x="260" y="330" width="620" height="52" fill="#FFFFFF" stroke="#D9DBD3" stroke-width="1.2"/>
<text x="274" y="360" font-size="11.8" font-weight="400" fill="#171E27" text-anchor="start">n = 16 · active in the last 30 days · mix of new and returning · screenshot verification of live experience.</text>
<rect x="80" y="390" width="180" height="52" fill="#F4F4F0" stroke="#D9DBD3" stroke-width="1.2"/>
<text x="92" y="420" font-size="12" font-weight="600" fill="#171E27" text-anchor="start" font-family="Space Grotesk, IBM Plex Sans, Arial, sans-serif">Timeline</text>
<rect x="260" y="390" width="620" height="52" fill="#FFFFFF" stroke="#D9DBD3" stroke-width="1.2"/>
<text x="274" y="420" font-size="11.8" font-weight="400" fill="#171E27" text-anchor="start">Recruit: 2 days · Field: 5 days · Synthesis: 3 days · Share-out: day 11.</text>
<rect x="80" y="450" width="180" height="52" fill="#F4F4F0" stroke="#D9DBD3" stroke-width="1.2"/>
<text x="92" y="480" font-size="12" font-weight="600" fill="#171E27" text-anchor="start" font-family="Space Grotesk, IBM Plex Sans, Arial, sans-serif">Deliverables</text>
<rect x="260" y="450" width="620" height="52" fill="#FFFFFF" stroke="#D9DBD3" stroke-width="1.2"/>
<text x="274" y="480" font-size="11.8" font-weight="400" fill="#171E27" text-anchor="start">TL;DR (1 page) · report · share-out deck · repository entry tagged [product area].</text>
<rect x="80" y="510" width="180" height="52" fill="#F4F4F0" stroke="#D9DBD3" stroke-width="1.2"/>
<text x="92" y="540" font-size="12" font-weight="600" fill="#171E27" text-anchor="start" font-family="Space Grotesk, IBM Plex Sans, Arial, sans-serif">Risks and limits</text>
<rect x="260" y="510" width="620" height="52" fill="#FFFFFF" stroke="#D9DBD3" stroke-width="1.2"/>
<text x="274" y="540" font-size="11.8" font-weight="400" fill="#171E27" text-anchor="start">Prototype fidelity differs from live flow; findings are directional for step 3 until validated in-product.</text>
