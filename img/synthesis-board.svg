<text x="44" y="408" font-size="13" font-weight="600" fill="#171E27" text-anchor="start" font-family="Space Grotesk, IBM Plex Sans, Arial, sans-serif">Theme · speed and exit</text>
<text x="44" y="428" font-size="12.5" font-weight="400" fill="#4B5563" text-anchor="start">Grid invites fast triage.</text>
<text x="44" y="446" font-size="12.5" font-weight="400" fill="#4B5563" text-anchor="start">Success = leaving quickly with one good pick.</text>
<text x="516" y="408" font-size="13" font-weight="600" fill="#171E27" text-anchor="start" font-family="Space Grotesk, IBM Plex Sans, Arial, sans-serif">Theme · depth and drift</text>
<text x="516" y="428" font-size="12.5" font-weight="400" fill="#4B5563" text-anchor="start">Linear invites continued reading.</text>
<text x="516" y="446" font-size="12.5" font-weight="400" fill="#4B5563" text-anchor="start">Success = staying, with a risk of &#x27;lost time&#x27;.</text>
