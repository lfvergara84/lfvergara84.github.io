<text x="480.0" y="531.0" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" font-family="Space Grotesk, IBM Plex Sans, Arial, sans-serif">Finding: layout sets the mindset. Choose the layout for the job the surface is hired to do, not for looks.</text>
