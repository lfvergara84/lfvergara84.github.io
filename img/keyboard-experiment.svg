<text x="824.0" y="124.0" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle" font-family="Space Grotesk, IBM Plex Sans, Arial, sans-serif">Measures</text>
<text x="824.0" y="140.0" font-size="11.5" font-weight="400" fill="#FEF3E2" text-anchor="middle" font-family="IBM Plex Mono, Menlo, Consolas, monospace">WPM · error rate · time</text>
<rect x="908" y="84" width="26" height="20" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/>
<text x="921" y="98" font-size="10.5" font-weight="600" fill="#B45309" text-anchor="middle" font-family="IBM Plex Mono, Menlo, Consolas, monospace">04</text>
<rect x="24" y="204" width="912" height="120" fill="#FEF3E2" stroke="#F59E0B" stroke-width="1.2"/>
<rect x="24" y="204" width="4" height="120" fill="#F59E0B" stroke="#F59E0B" stroke-width="0"/>
<text x="44" y="232" font-size="14" font-weight="600" fill="#B45309" text-anchor="start" font-family="Space Grotesk, IBM Plex Sans, Arial, sans-serif">What the tool logged automatically</text>
<text x="44" y="256" font-size="12.5" font-weight="400" fill="#171E27" text-anchor="start">Keystroke timing and corrections per trial · order of conditions (counterbalanced per student) · summary stats and a t-test between conditions</text>
<text x="44" y="300" font-size="12.5" font-weight="400" fill="#4B5563" text-anchor="start">Students wrote the hypothesis, ran the trials, read the output and defended a conclusion in class.</text>
