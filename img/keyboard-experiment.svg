<text x="584.0" y="124.0" font-size="14" font-weight="600" fill="#171E27" text-anchor="middle" font-family="Space Grotesk, IBM Plex Sans, Arial, sans-serif">Variant layout</text>
<text x="584.0" y="140.0" font-size="11.5" font-weight="400" fill="#4B5563" text-anchor="middle" font-family="IBM Plex Mono, Menlo, Consolas, monospace">same task · same text</text>
<rect x="658" y="84" width="26" height="20" fill="#B45309" stroke="#B45309" stroke-width="0"/>
