<text x="124.0" y="133.0" font-size="11.5" font-weight="400" fill="#B45309" text-anchor="middle" font-family="IBM Plex Mono, Menlo, Consolas, monospace">e.g. layout B reduces</text>
<text x="124.0" y="147.0" font-size="11.5" font-weight="400" fill="#B45309" text-anchor="middle" font-family="IBM Plex Mono, Menlo, Consolas, monospace">errors</text>
<rect x="198" y="84" width="26" height="20" fill="#B45309" stroke="#B45309" stroke-width="0"/>
<text x="211" y="98" font-size="10.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" font-family="IBM Plex Mono, Menlo, Consolas, monospace">01</text>
<line x1="224" y1="129" x2="250" y2="129" stroke="#B45309" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="257" y="87" width="200" height="90" fill="#FEF3E2" opacity="0.85"/>
