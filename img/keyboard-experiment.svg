<text x="354.0" y="140.0" font-size="11.5" font-weight="400" fill="#4B5563" text-anchor="middle" font-family="IBM Plex Mono, Menlo, Consolas, monospace">typing task · n trials</text>
<rect x="428" y="84" width="26" height="20" fill="#B45309" stroke="#B45309" stroke-width="0"/>
<text x="441" y="98" font-size="10.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" font-family="IBM Plex Mono, Menlo, Consolas, monospace">02</text>
<line x1="454" y1="129" x2="480" y2="129" stroke="#B45309" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="487" y="87" width="200" height="90" fill="#FEF3E2" opacity="0.85"/>
